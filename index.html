<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SING WUAZE</title>
    <link rel="icon" type="image/png" href="assets/ic.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        @font-face { font-family: 'WZ'; src: url('assets/wz.ttf'); }
        html, body { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: 'WZ'; }
        
        #loadingScreen { position: fixed; inset: 0; background: url('assets/loading.jpg') no-repeat center center; background-size: cover; z-index: 99999; }
        #mainContent { display: none; }
        #bgVideo { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -3; }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: -2; }

        /* Song List Window */
        #songListWindow {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 70%; height: 75%; background: rgba(0, 0, 0, 0.95);
            border: 3px solid #001fcc; border-radius: 15px; z-index: 2000;
            display: none; flex-direction: column; padding: 20px;
            box-shadow: 0 0 30px rgba(0, 31, 204, 0.5);
        }
        #songListHeader { 
            color: #00d2ff; font-size: 40px; text-align: center; 
            margin-bottom: 20px; text-transform: uppercase; -webkit-text-stroke: 1px black;
        }
        #searchBar {
            width: 95%; padding: 12px; margin: 0 auto 15px;
            background: rgba(255,255,255,0.1); border: 2px solid #001fcc;
            color: white; font-family: 'WZ'; font-size: 22px; outline: none;
        }
        #songListContent { flex: 1; overflow-y: auto; padding-right: 10px; }
        .song-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1);
            color: white; transition: background 0.2s; cursor: pointer;
        }
        .song-item:hover { background: rgba(0, 31, 204, 0.3); }
        .song-info { display: flex; flex-direction: column; }
        .song-item-title { font-size: 24px; color: #00d2ff; }
        .song-item-artist { font-size: 18px; opacity: 0.8; }
        .song-item-code { font-size: 30px; color: #ff0000; font-weight: bold; -webkit-text-stroke: 0.5px white; }

        #songListContent::-webkit-scrollbar { width: 8px; }
        #songListContent::-webkit-scrollbar-track { background: transparent; }
        #songListContent::-webkit-scrollbar-thumb { background: #001fcc; border-radius: 10px; }

        #statusNotify {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 31, 204, 0.9); color: white; padding: 10px 30px;
            border: 2px solid white; font-family: 'WZ'; font-size: 24px; z-index: 1000;
            text-transform: uppercase; pointer-events: none; display: none;
        }

        #songCodeDisplay {
            position: absolute; top: 25px; left: 35px; 
            font-size: 40px; color: white; -webkit-text-stroke: 1.5px black;
            z-index: 100; font-family: 'WZ'; display: none; opacity: 0.9;
        }

        #titleWrapper {
            position: absolute; width: 100%; text-align: center; z-index: 5;
            top: 40px; left: 0; display: flex; flex-direction: column; align-items: center; white-space: nowrap;
        }
        #titleWrapper.centerStage { top: 50%; transform: translateY(-50%) scale(1.1); transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        #titleWrapper.cornerStage { 
            top: auto; bottom: 20px; left: 25px; width: auto; 
            flex-direction: row; align-items: baseline; 
            transform: scale(0.30); transform-origin: left bottom; 
            transition: none !important; 
        }

        #topCountdown {
            position: absolute; bottom: 105%; left: 0;
            width: auto; height: 50px;
            display: flex; justify-content: flex-start; align-items: center;
            gap: 10px; z-index: 25;
        }
        .count-box {
            width: 45px; height: 45px; display: none;
            justify-content: center; align-items: center;
            color: white; font-size: 35px; font-weight: bold;
            -webkit-text-stroke: 1px black; border: 2px solid white;
        }
        #box3 { background: #001fcc; }
        #box2 { background: #ff0000; }
        #box1 { background: #008000; }

        #interludeText {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 60px; color: #00d2ff; -webkit-text-stroke: 2px black;
            z-index: 15; display: none; letter-spacing: 5px; text-transform: uppercase;
        }

        #pausedText {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 100px; color: white; -webkit-text-stroke: 3px black;
            z-index: 40; display: none; letter-spacing: 10px;
        }

        #lyricsContainer {
            position: absolute; bottom: 12%; width: 100%; z-index: 20; pointer-events: none;
            display: flex; flex-direction: column; align-items: center;
        }

        .lyric-slot { width: 92%; height: 90px; display: flex; position: relative; }
        #slot1 { justify-content: flex-start; }
        #slot2 { justify-content: flex-end; }

        .lyric-text { 
            font-size: 70px; text-transform: uppercase; color: white; 
            -webkit-text-stroke: 3px black; white-space: nowrap; opacity: 0; position: relative;
        }

        .lyric-text.too-long { width: 100%; text-align: center; }
        .lyric-text.visible { opacity: 0.4; }
        .lyric-text.active { opacity: 1; }

        .lyric-text.active::before {
            content: attr(data-text);
            position: absolute; left: 0; top: 0; width: 100%; height: 100%;
            color: #001fcc; -webkit-text-stroke: 3px white; z-index: 2;
            clip-path: inset(0 100% 0 0); 
            animation: lyricClip var(--wipe-duration, 5s) linear forwards;
            animation-delay: inherit;
        }

        .no-anim.active::before { animation: none !important; clip-path: inset(0 0 0 0) !important; }
        .paused-anim::before { animation-play-state: paused !important; }

        @keyframes lyricClip { 0% { clip-path: inset(0 100% 0 0); } 100% { clip-path: inset(0 0 0 0); } }

        #timeDisplay { position: absolute; bottom: 15px; right: 20px; font-size: 20px; color: white; -webkit-text-stroke: 1px black; z-index: 5; display: none; }
        .blink { animation: blinkAnim 1s infinite; }
        .pausedBlink { animation: blinkAnim 1.5s infinite; opacity: 0.7; }
        #songTitle { font-size: 80px; color: white; -webkit-text-stroke: 3px black; }
        #artistName { font-size: 45px; color: white; -webkit-text-stroke: 2.5px black; }
        .dash { display: none; font-size: 80px; color: white; -webkit-text-stroke: 3px black; margin: 0 5px; }
        
        #titleWrapper.cornerStage .dash { display: inline; }
        #titleWrapper.cornerStage #songTitle, #titleWrapper.cornerStage #artistName { font-size: 70px; margin: 0; padding: 0; }

        @keyframes blinkAnim { 0%, 49% { visibility: visible; } 50%, 100% { visibility: hidden; } }
        #numberDisplay { position: absolute; bottom: 120px; width: 100%; text-align: center; font-size: 80px; color: white; -webkit-text-stroke: 3px black; letter-spacing: 10px; z-index: 5; }
        #logo { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 190px; z-index: 5; transition: opacity 0.5s; }
    </style>
</head>

<body>
<div id="loadingScreen"></div>

<div id="songListWindow">
    <div id="songListHeader">SONG LIBRARY</div>
    <input type="text" id="searchBar" placeholder="SEARCH TITLE, ARTIST, OR CODE..." oninput="filterSongs()">
    <div id="songListContent"></div>
</div>

<div id="statusNotify">ANIMATIONS OFF</div>
<div id="mainContent">
    <div id="songCodeDisplay"></div>
    <video id="bgVideo" autoplay muted loop playsinline><source src="assets/bg_v.mp4" type="video/mp4"></video>
    <div id="overlay"></div>
    <img src="assets/ic_title.png" style="position:absolute; top:15px; right:20px; width:120px; z-index:5;">
    <img src="assets/ic.png" id="logo">
    
    <div id="titleWrapper" class="blink">
        <div id="songTitle">SELECT SONG</div>
        <span class="dash">-</span>
        <div id="artistName"></div>
    </div>

    <div id="pausedText">PAUSED</div>
    <div id="timeDisplay">0:00</div>
    
    <div id="lyricsContainer">
        <div class="lyric-slot" id="slot1">
            <div id="topCountdown">
                <div id="box3" class="count-box">3</div>
                <div id="box2" class="count-box">2</div>
                <div id="box1" class="count-box">1</div>
            </div>
            <div id="line1" class="lyric-text" data-text=""></div>
        </div>
        <div class="lyric-slot" id="slot2">
            <div id="line2" class="lyric-text" data-text=""></div>
        </div>
    </div>

    <div id="interludeText">&lt;INTERLUDE&gt;</div>
    <div id="numberDisplay"></div>
</div>
<audio id="bootSound" src="assets/sfx_boot.mp3"></audio>

<script>
let songData = {};
let currentNumbers = "";
let lyricsData = [];
const limit = 5;
let loadingFinished = false;
let isPlaying = false;
let isPausedUI = false;
let uiVisible = true;
let isTensionMode = false; 
let isSongListOpen = false;
let currentBlobUrls = [];
let notifyTimeout;

const instTrack = new Audio();
const vocalTrack = new Audio();
instTrack.crossOrigin = "anonymous";
vocalTrack.crossOrigin = "anonymous";

instTrack.onended = () => { goHome(); };

let audioCtx, instSource, vocalSource, delayNode, feedbackNode, dryGain, echoOutGain, vocalGain;

const display = document.getElementById("numberDisplay");
const title = document.getElementById("songTitle");
const artist = document.getElementById("artistName");
const codeDisplay = document.getElementById("songCodeDisplay");
const titleWrapper = document.getElementById("titleWrapper");
const logoImg = document.getElementById("logo");
const timeDisplay = document.getElementById("timeDisplay");
const interludeEl = document.getElementById("interludeText");
const pausedOverlay = document.getElementById("pausedText");
const line1 = document.getElementById("line1");
const line2 = document.getElementById("line2");
const boxes = { 3: document.getElementById("box3"), 2: document.getElementById("box2"), 1: document.getElementById("box1") };
const notifyEl = document.getElementById("statusNotify");
const songListWin = document.getElementById("songListWindow");
const songListContent = document.getElementById("songListContent");
const searchInput = document.getElementById("searchBar");

fetch("songbundle/songlist.json").then(res => res.json()).then(data => { 
    songData = data.songs;
    populateSongList();
});

function populateSongList() {
    songListContent.innerHTML = "";
    Object.keys(songData).sort().forEach(code => {
        const item = document.createElement("div");
        item.className = "song-item";
        const songName = songData[code][0];
        const artistName = songData[code][1].split('=')[0].trim();
        item.innerHTML = `
            <div class="song-info">
                <span class="song-item-title">${songName.toUpperCase()}</span>
                <span class="song-item-artist">${artistName.toUpperCase()}</span>
            </div>
            <div class="song-item-code">${code}</div>
        `;
        item.onclick = () => {
            if (isPlaying) return; // Prevent clicking song list while playing
            currentNumbers = code;
            display.textContent = code;
            toggleSongList();
            resetToNormal();
        };
        songListContent.appendChild(item);
    });
}

function filterSongs() {
    const term = searchInput.value.toUpperCase();
    const items = document.getElementsByClassName("song-item");
    Array.from(items).forEach(item => {
        const text = item.textContent.toUpperCase();
        item.style.display = text.includes(term) ? "flex" : "none";
    });
}

function toggleSongList() {
    isSongListOpen = !isSongListOpen;
    songListWin.style.display = isSongListOpen ? "flex" : "none";
    if(isSongListOpen) {
        searchInput.value = "";
        filterSongs();
    } else {
        searchInput.blur();
    }
}

function showNotify(msg) {
    clearTimeout(notifyTimeout);
    notifyEl.textContent = msg;
    notifyEl.style.display = "block";
    notifyTimeout = setTimeout(() => { notifyEl.style.display = "none"; }, 1500);
}

function refreshLyricsState() {
    const now = instTrack.currentTime;
    [line1, line2].forEach(el => {
        if (isTensionMode) {
            el.classList.add('no-anim');
            el.style.animationDelay = "0s";
        } else {
            el.classList.remove('no-anim');
            if (el.classList.contains('active') && lastIdx !== -1) {
                const startTime = lyricsData[lastIdx].time;
                const elapsed = now - startTime;
                el.style.animationDelay = `-${elapsed}s`;
            }
        }
    });
}

function formatTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins}:${secs.toString().padStart(2, '0')}`;
}

function initAudioEngine() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    dryGain = audioCtx.createGain();       
    echoOutGain = audioCtx.createGain();   
    vocalGain = audioCtx.createGain(); 
    delayNode = audioCtx.createDelay(1.0);
    feedbackNode = audioCtx.createGain();
    vocalGain.gain.value = 0.05; 
    delayNode.delayTime.value = 0.35;      
    feedbackNode.gain.value = 0.45;        
    echoOutGain.gain.value = 0;           
    dryGain.connect(audioCtx.destination);
    dryGain.connect(delayNode);
    delayNode.connect(feedbackNode);
    feedbackNode.connect(delayNode);
    delayNode.connect(echoOutGain);
    echoOutGain.connect(audioCtx.destination);
    instSource = audioCtx.createMediaElementSource(instTrack);
    vocalSource = audioCtx.createMediaElementSource(vocalTrack);
    instSource.connect(dryGain);
    vocalSource.connect(vocalGain);
    vocalGain.connect(dryGain);
}

function adjustFontSize(el) {
    let fontSize = 70;
    el.style.fontSize = fontSize + "px";
    el.classList.remove('too-long');
    if (el.scrollWidth > el.parentElement.offsetWidth * 0.7) { el.classList.add('too-long'); }
    while (el.scrollWidth > el.parentElement.offsetWidth && fontSize > 15) {
        fontSize -= 1;
        el.style.fontSize = fontSize + "px";
    }
}

let lastIdx = -1;

function syncLoop() {
    if (!isPlaying || isPausedUI) return;
    const now = instTrack.currentTime;
    timeDisplay.textContent = formatTime(now);
    let currentIdx = -1;
    for (let i = 0; i < lyricsData.length; i++) {
        if (now >= lyricsData[i].time) { currentIdx = i; } 
        else { break; }
    }

    if (lyricsData.length > 0 && now < lyricsData[0].time) {
        const firstLyricTime = lyricsData[0].time;
        const diff = firstLyricTime - now;
        interludeEl.style.display = (diff > 4) ? "block" : "none";
        
        if (line1.textContent !== lyricsData[0].text) {
            line1.textContent = lyricsData[0].text;
            line1.setAttribute("data-text", lyricsData[0].text);
            line1.className = `lyric-text visible ${isTensionMode ? 'no-anim' : ''}`;
            adjustFontSize(line1);
        }
        if (lyricsData[1] && line2.textContent !== lyricsData[1].text) {
            line2.textContent = lyricsData[1].text;
            line2.setAttribute("data-text", lyricsData[1].text);
            line2.className = `lyric-text visible ${isTensionMode ? 'no-anim' : ''}`;
            adjustFontSize(line2);
        }

        boxes[3].style.display = (diff <= 3.2 && diff > 2.2) ? "flex" : "none";
        boxes[2].style.display = (diff <= 2.2 && diff > 1.2) ? "flex" : "none";
        boxes[1].style.display = (diff <= 1.2 && diff > 0.2) ? "flex" : "none";
    } else {
        interludeEl.style.display = "none";
        Object.values(boxes).forEach(b => b.style.display = "none");
    }

    if (currentIdx !== lastIdx) {
        lastIdx = currentIdx;
        if (currentIdx !== -1) {
            const isEven = (currentIdx % 2 === 0);
            const activeEl = isEven ? line1 : line2;
            const nextEl = isEven ? line2 : line1;
            activeEl.textContent = lyricsData[currentIdx].text;
            activeEl.setAttribute("data-text", lyricsData[currentIdx].text);
            let nextTime = lyricsData[currentIdx + 1] ? lyricsData[currentIdx + 1].time : instTrack.duration;
            let duration = Math.max(0.5, nextTime - lyricsData[currentIdx].time);
            activeEl.style.setProperty('--wipe-duration', `${duration}s`);
            
            if (!isTensionMode) {
                const elapsedSinceStart = now - lyricsData[currentIdx].time;
                activeEl.style.animationDelay = `-${elapsedSinceStart}s`;
            } else { activeEl.style.animationDelay = "0s"; }

            activeEl.className = `lyric-text active ${isTensionMode ? 'no-anim' : ''}`;
            adjustFontSize(activeEl);
            if (lyricsData[currentIdx + 1]) {
                nextEl.textContent = lyricsData[currentIdx + 1].text;
                nextEl.setAttribute("data-text", lyricsData[currentIdx + 1].text);
                nextEl.className = `lyric-text visible ${isTensionMode ? 'no-anim' : ''}`;
                adjustFontSize(nextEl);
            }
        }
    }
    requestAnimationFrame(syncLoop);
}

async function fetchLyrics(apiUrl, duration) {
    lyricsData = [];
    try {
        const res = await fetch(apiUrl);
        const data = await res.json();
        const lrcString = data.syncedLyrics || data.lrc || "";
        if (!lrcString) return;
        const lines = lrcString.split('\n');
        lines.forEach((line) => {
            const timeMatch = line.match(/\[(\d+):(\d+[:.]\d+)\]/);
            if (timeMatch) {
                const startTime = parseInt(timeMatch[1]) * 60 + parseFloat(timeMatch[2].replace(':', '.'));
                if (startTime < duration) {
                    let text = line.replace(/\[.*?\]/, '').trim().replace(/[.,\-_`'";:!@#$%^&*()]/g, "").toUpperCase();
                    if (text) lyricsData.push({ time: startTime, text: text });
                }
            }
        });
    } catch (e) { console.error("FETCH ERROR:", e); }
}

async function playSelectedSong() {
    if (isPlaying || !songData[currentNumbers]) return;
    const sT = songData[currentNumbers][0];
    const rawArtist = songData[currentNumbers][1];
    let displayArtist = rawArtist.includes('=') ? rawArtist.split('=')[0].trim() : rawArtist;
    let searchArtist = rawArtist.includes('=') ? rawArtist.split('=')[1].trim() : rawArtist;
    const swkURL = `songbundle/${displayArtist.toUpperCase()} - ${sT.toUpperCase()}.swk`;
    titleWrapper.classList.remove('blink', 'cornerStage');
    titleWrapper.classList.add('centerStage');
    display.textContent = ""; 
    logoImg.style.opacity = "0";
    title.textContent = sT.toUpperCase();
    artist.textContent = displayArtist.toUpperCase();
    codeDisplay.textContent = currentNumbers; 
    try {
        const res = await fetch(swkURL);
        const blob = await res.blob();
        const zip = await JSZip.loadAsync(blob);
        const zipFiles = Object.keys(zip.files);
        let manualUrl = null;
        const lrcFile = zipFiles.find(f => f.toLowerCase().endsWith("lrc.json"));
        if (lrcFile) {
            const lrcText = await zip.file(lrcFile).async("string");
            const parsed = JSON.parse(lrcText);
            if (parsed.url) manualUrl = parsed.url;
        }
        const instKey = zipFiles.find(f => f.toLowerCase().includes("instruments.mp3"));
        const vocalKey = zipFiles.find(f => f.toLowerCase().includes("vocals.mp3"));
        currentBlobUrls.forEach(url => URL.revokeObjectURL(url));
        currentBlobUrls = [];
        const instBlob = await zip.file(instKey).async("blob");
        const vocalBlob = await zip.file(vocalKey).async("blob");
        const instUrl = URL.createObjectURL(instBlob);
        const vocalUrl = URL.createObjectURL(vocalBlob);
        currentBlobUrls.push(instUrl, vocalUrl);
        instTrack.src = instUrl; vocalTrack.src = vocalUrl;
        await new Promise((r) => { instTrack.onloadedmetadata = r; });
        let finalUrl = manualUrl || `https://lrclib.net/api/get?artist_name=${encodeURIComponent(searchArtist)}&track_name=${encodeURIComponent(sT)}&duration=${Math.round(instTrack.duration)}`;
        await fetchLyrics(finalUrl, instTrack.duration);
        await new Promise(r => setTimeout(r, 4000));
        if(titleWrapper.classList.contains('centerStage')) {
            titleWrapper.classList.remove('centerStage');
            titleWrapper.classList.add('cornerStage');
            if(uiVisible) {
                timeDisplay.style.display = "block";
                codeDisplay.style.display = "block";
            }
            isPlaying = true; isPausedUI = false; lastIdx = -1;
            dryGain.gain.setValueAtTime(1.0, audioCtx.currentTime);
            echoOutGain.gain.setValueAtTime(0, audioCtx.currentTime);
            instTrack.play(); vocalTrack.play();
            requestAnimationFrame(syncLoop);
        }
    } catch (err) { title.textContent = "FILE ERROR"; logoImg.style.opacity = "1"; }
}

function goHome() {
    if (isPlaying && !isPausedUI && audioCtx) {
        echoOutGain.gain.setValueAtTime(1.0, audioCtx.currentTime); 
        dryGain.gain.setValueAtTime(0, audioCtx.currentTime);
        setTimeout(() => { if(audioCtx) echoOutGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.5); }, 1500);
    }
    currentNumbers = ""; display.textContent = ""; resetToNormal();
}

function resetToNormal() {
    isPlaying = false; isPausedUI = false;
    instTrack.pause(); vocalTrack.pause(); instTrack.src = ""; vocalTrack.src = "";
    timeDisplay.style.display = "none"; codeDisplay.style.display = "none";
    pausedOverlay.style.display = "none"; interludeEl.style.display = "none";
    Object.values(boxes).forEach(b => b.style.display = "none");
    titleWrapper.style.opacity = "1"; titleWrapper.className = "blink"; 
    line1.textContent = ""; line2.textContent = ""; lyricsData = [];
    line1.className = "lyric-text"; line2.className = "lyric-text";
    logoImg.style.display = "block"; logoImg.style.opacity = "1";
    if (songData[currentNumbers]) {
        const rawArtist = songData[currentNumbers][1];
        const displayArtist = rawArtist.includes('=') ? rawArtist.split('=')[0].trim() : rawArtist;
        title.textContent = songData[currentNumbers][0].toUpperCase();
        artist.textContent = displayArtist.toUpperCase();
    } else { title.textContent = "SELECT SONG"; artist.textContent = ""; }
}

function togglePause() {
    if (!isPlaying) return;
    if (!isPausedUI) {
        isPausedUI = true; titleWrapper.classList.add('pausedBlink');
        pausedOverlay.style.display = "block"; instTrack.pause(); vocalTrack.pause();
        echoOutGain.gain.setValueAtTime(1.0, audioCtx.currentTime); dryGain.gain.setValueAtTime(0, audioCtx.currentTime);
        line1.classList.add('paused-anim'); line2.classList.add('paused-anim');
    } else {
        isPausedUI = false; titleWrapper.classList.remove('pausedBlink');
        pausedOverlay.style.display = "none"; echoOutGain.gain.setValueAtTime(0, audioCtx.currentTime); 
        dryGain.gain.setValueAtTime(1.0, audioCtx.currentTime); instTrack.play(); vocalTrack.play(); 
        line1.classList.remove('paused-anim'); line2.classList.remove('paused-anim'); requestAnimationFrame(syncLoop);
    }
}

function toggleUI() {
    uiVisible = !uiVisible;
    const opacity = uiVisible ? "1" : "0";
    codeDisplay.style.display = (isPlaying && uiVisible) ? "block" : "none";
    timeDisplay.style.display = (isPlaying && uiVisible) ? "block" : "none";
    titleWrapper.style.opacity = opacity;
}

window.addEventListener("load", () => {
    setTimeout(() => {
        document.getElementById("loadingScreen").style.display = "none";
        document.getElementById("mainContent").style.display = "block";
        loadingFinished = true;
        document.getElementById("bootSound").play().catch(()=>{});
    }, 7000);
});

document.addEventListener("keydown", (e) => {
    if (!loadingFinished) return;
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") {
        if (e.key === "Escape") toggleSongList();
        return; 
    }
    if (e.repeat) return;
    const key = e.key.toLowerCase();
    
    if (key === "b") {
        e.preventDefault(); 
        toggleSongList();
        return;
    }
    if (key === "`") {
        const bgVideo = document.getElementById("bgVideo");
        bgVideo.src = "assets/bg_v_1.mp4";
        bgVideo.load(); bgVideo.play().catch(() => {});
    } else if (key === "t") {
        isTensionMode = !isTensionMode;
        showNotify(isTensionMode ? "ANIMATIONS OFF" : "ANIMATIONS ON");
        refreshLyricsState(); 
    } else if (key === "enter") {
        if (isPlaying) return; // Ignore Enter if song is playing
        initAudioEngine();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        playSelectedSong();
    } else if (key === "p") { togglePause(); }
    else if (key === "h") { goHome(); }
    else if (key === "i") { toggleUI(); }
    else if (/^[0-9]$/.test(key)) {
        // LOCK: Only allow typing numbers if NO song is playing
        if (!isPlaying) {
            new Audio(`assets/${key}_wz.mp3`).play().catch(()=>{});
            currentNumbers = currentNumbers.length >= limit ? currentNumbers.substring(1) + key : currentNumbers + key;
            display.textContent = currentNumbers; 
            resetToNormal();
        }
    }
});
</script>
</body>
</html>
